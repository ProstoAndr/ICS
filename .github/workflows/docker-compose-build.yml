name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prostoandr/ics

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout репозитория
        uses: actions/checkout@v4

      - name: 🐳 Установка Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: 🔍 Проверка docker-compose.yml
        run: docker-compose config

      - name: 🏗️ Сборка Docker-образов
        run: docker-compose build

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout репозитория
        uses: actions/checkout@v4

      - name: 🔑 Авторизация в GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Сборка и публикация Docker-образа
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/prostoandr/ics:latest
            ghcr.io/prostoandr/ics:${{ github.sha }}
